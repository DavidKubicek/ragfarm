# compose.yaml — ragfarm on-prem stack.
# llama-server and the NPU embedder run on the HOST (they need direct iGPU/NPU
# device access via Vulkan / XRT), NOT in containers. Containers here are the
# stateless/CPU pieces. host.docker.internal lets containers reach host llama-server.
#
# Proxy: each container that may reach the network inherits HTTP(S)_PROXY/NO_PROXY
# from the shell via ${VAR:-} substitution. Run compose AFTER sourcing the loader,
# which fills these (empty = direct) and guarantees NO_PROXY covers the internal
# hosts so inter-container calls (-> qdrant, host.docker.internal) never proxy:
#     source scripts/proxy-env.sh && docker compose -f infra/compose.yaml up -d
# The `&proxy_env` anchor below is merged into each service's environment.
# NOTE: image *pulls* go through the Docker daemon, not these vars — configure the
# daemon's proxy separately (docs/ or /etc/systemd/system/docker.service.d/) if the
# registry is only reachable via proxy.
# .env AT THE REPO ROOT IS THE SINGLE SOURCE OF TRUTH (2026-08-03).
# `env_file` injects it into each container as real environment variables. This is
# NOT the same as compose's own `.env` handling, which only does ${VAR} substitution
# in THIS FILE and never puts anything inside a container. python-dotenv is verified
# to work in our images, but the file itself is absent from them — hence env_file.
# Values set under a service's `environment:` still win over the file, so the
# container-specific overrides below (e.g. host.docker.internal wiring) are safe.
x-env-file: &env_file
  - path: ../.env
    required: false

x-proxy-env: &proxy_env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,0.0.0.0,::1,host.docker.internal,qdrant}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,0.0.0.0,::1,host.docker.internal,qdrant}

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: infra-qdrant
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  mcp-placement:
    build: ../services/mcp-placement
    container_name: infra-mcp-placement
    restart: unless-stopped
    # BLOCKED for LIVE use in PoC (no OpenNebula creds yet); .env is filled at
    # deployment, so mark it optional or full-config compose commands fail.
    # ONE_MOCK defaults to 1 (canned data) so the integration can be tested with no
    # cluster; set ONE_MOCK=0 once real ONE_XMLRPC/ONE_AUTH are in .env.
    env_file:
      # repo-root .env first (the base), then the service-specific file so it can
      # override. Later entries win in compose.
      - path: ../.env
        required: false
      - path: ../services/mcp-placement/.env
        required: false
    environment:
      <<: *proxy_env
      ONE_MOCK: ${ONE_MOCK:-1}
    ports: ["127.0.0.1:8101:8101"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  mcp-host-control:
    build: ../services/mcp-host-control
    container_name: infra-mcp-host-control
    restart: unless-stopped
    # HOST_MOCK defaults to 1 (simulated drain/reboot, nothing real); set HOST_MOCK=0
    # at deployment. HOST_ALLOWLIST gates confirm=True actions (mock nodes here).
    env_file:
      # repo-root .env first (the base), then the service-specific file so it can
      # override. Later entries win in compose.
      - path: ../.env
        required: false
      - path: ../services/mcp-host-control/.env
        required: false
    environment:
      <<: *proxy_env
      HOST_MOCK: ${HOST_MOCK:-1}
      HOST_ALLOWLIST: ${HOST_ALLOWLIST:-node-01,node-02,node-03}
    ports: ["127.0.0.1:8102:8102"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  mcp-fs:
    build: ../services/mcp-fs
    container_name: infra-mcp-fs
    restart: unless-stopped
    env_file: *env_file
    environment:
      <<: *proxy_env
      FS_SANDBOX_ROOT: /data/corpus
    volumes: ["/data/corpus:/data/corpus:ro"]
    ports: ["127.0.0.1:8103:8103"]

  # rag-retrieval — search_corpus (hybrid dense+sparse RRF over Qdrant + host
  # embedder). ADR-0003 Option B: the corpus RAG tool lives here, not in the UI.
  # HOST NETWORKING: the generative LLM (:8080) and BGE-M3 embedder (:8090) run on
  # the host bound to 127.0.0.1 (loopback-only, not exposed to the LAN). Host
  # networking lets this container reach them at 127.0.0.1 without widening their
  # bind. It listens on 127.0.0.1:8104 (RAG_HOST) so it too stays loopback-only.
  rag-retrieval:
    build: ../services/rag-retrieval
    container_name: infra-rag-retrieval
    restart: unless-stopped
    network_mode: host
    env_file: *env_file
    environment:
      <<: *proxy_env
      QDRANT_URL: http://127.0.0.1:6333
      EMBED_ENDPOINT: http://127.0.0.1:8090/embed        # BGE-M3 embedder on host (loopback)
      RERANK_ENDPOINT: http://127.0.0.1:8081/reranking   # dedicated GPU llama.cpp reranker (ADR-0008)
      QDRANT_COLLECTION: corpus
      RAG_HOST: 127.0.0.1
      RAG_PORT: "8104"
    depends_on: [qdrant]

  # mcpo — bridges the MCP server(s) to OpenAPI so Open WebUI can call the tools
  # (ADR-0003). Host networking to reach rag-retrieval at 127.0.0.1:8104; serves
  # OpenAPI on 127.0.0.1:8000, each MCP mounted under /<name> (rag -> /rag).
  # placement + host-control are already mounted here and run in MOCK mode
  # (ONE_MOCK/HOST_MOCK); switch those to 0 once OpenNebula creds exist at
  # deployment — no "add them later" step remains.
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: infra-mcpo
    restart: unless-stopped
    network_mode: host
    env_file: *env_file
    environment:
      <<: *proxy_env
      # CONNECTION_TIMEOUT is used as the SSE-read timeout for MCP subprocess calls
      # (mcpo/main.py: `timeout = self.connection_timeout or 900`). Set explicitly so
      # a slow tool call — RAG rerank on a hot corpus, placement lookup with cold OpenNebula
      # — has room without hitting the aiohttp deadline layered above from OWUI.
      CONNECTION_TIMEOUT: "1200"
    volumes:
      - ../services/mcp-gateway/mcpo-config.json:/config.json:ro
    command: ["--host", "127.0.0.1", "--port", "8000", "--config", "/config.json"]
    depends_on: [rag-retrieval]

  # drawio-viewer — nginx serving BOTH the ragfarm landing page (index.html)
  # AND a full local mirror of the draw.io webapp (js/, styles/, shapes/,
  # stencils/, math4/, templates/, ...) so RULE 5 draw.io diagrams render
  # in-chat and the full editor is available at /drawio-editor.html.
  # No demo-day internet dep, no external CDN hits inside the CSP sandbox.
  #
  # Contents (~151 MB) come from jgraph/drawio's src/main/webapp — gitignored;
  # rehydrate with scripts/fetch-drawio-viewer.sh. Our two custom files
  # (index.html landing, and the renamed drawio-editor.html) ARE tracked.
  #
  # Bind: 0.0.0.0:80 (LAN-reachable landing + editor). Restrict at host
  # firewall to trusted networks; the pages themselves reveal nothing sensitive.
  drawio-viewer:
    image: nginx:alpine
    container_name: infra-drawio-viewer
    restart: unless-stopped
    ports: ["0.0.0.0:80:80"]
    volumes:
      - ../infra/drawio-viewer:/usr/share/nginx/html:ro
      # Serve tests/fixtures/ under /fixtures/ so vision-demo prompts can
      # reference stable http://<host>/fixtures/<file> URLs (board can download
      # the exact input, prompt reproduces exactly). Read-only, LAN-reachable
      # via the same 0.0.0.0:80 bind.
      - ../tests/fixtures:/usr/share/nginx/html/fixtures:ro

  # open-webui — the agent/UI layer (ADR-0003). Drives the swappable OpenAI
  # endpoint (llama-server on 127.0.0.1:8080) and calls MCP tools via the mcpo
  # OpenAPI server (127.0.0.1:8000). Its built-in document RAG is NOT used for the
  # corpus (Option B) — retrieval flows through search_corpus. Host networking to
  # reach the loopback host services, avoiding the :8080 clash with llama-server.
  # EXPOSURE: this is the ONLY service bound to 0.0.0.0 (OWUI_HOST) — remote web
  # access to the PoC. It is login-protected (WEBUI_AUTH on by default). The LLM
  # (:8080), embedder (:8090), mcpo (:8000) and rag-retrieval (:8104) stay
  # loopback-only. Restrict :3000 at the host firewall to trusted networks.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: infra-open-webui
    restart: unless-stopped
    network_mode: host
    env_file: *env_file
    environment:
      <<: *proxy_env
      HOST: ${OWUI_HOST:-0.0.0.0}    # 0.0.0.0 = reachable remotely (auth-gated); set 127.0.0.1 for loopback-only
      PORT: "3000"
      # One entry PER vLLM SLOT, semicolon-separated. vLLM serves ONE base model
      # per process, so two resident models means two endpoints — and both must be
      # registered here or the second model never appears in the UI's model list,
      # which is what makes mid-chat model switching (same conversation, different
      # model) possible. Slot N -> 8080 + 2N; 8081 is the reranker.
      # Managed alongside models/llm/active.json — see scripts/activate_llm.py.
      OPENAI_API_BASE_URLS: ${OWUI_OPENAI_BASE_URLS:-http://127.0.0.1:8080/v1;http://127.0.0.1:8082/v1}
      OPENAI_API_KEYS: ${OWUI_OPENAI_KEYS:-sk-no-auth-local;sk-no-auth-local}    # vLLM ignores auth; placeholders keep OWUI happy
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      # Prompt-round timeout ceilings. OWUI's built-in default for AIOHTTP_CLIENT_TIMEOUT
      # (the one used for /v1/chat/completions and outbound tool calls) is 300 s; we push
      # it to 600 s so a Thinking-model long OCR turn or a deep RAG round can't hit the
      # aiohttp deadline mid-generation. AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER inherits this
      # unless set explicitly. Board demo has ~40 s vision OCR and ~150-200 s
      # Farsi-with-translation prompts — 600 s leaves comfortable headroom for the
      # dGPU-projected times too (they'll shrink 6-9x, so this stays over-sized).
      AIOHTTP_CLIENT_TIMEOUT: "1200"
      AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER: "1200"
      # IFRAME_CSP relaxes the HTML-preview iframe's Content-Security-Policy just
      # enough to let the vision preset's draw.io template load the local drawio
      # webapp (127.0.0.1 :80, i.e. no explicit port). Whitelist covers script,
      # style, image, and connect (needed for shape/stencil XHR loads). Without
      # this OWUI defaults to a strict CSP that blocks all script-src, so the
      # diagram would render as inert HTML.
      IFRAME_CSP: "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://127.0.0.1 http://127.0.0.1:80; style-src 'self' 'unsafe-inline' http://127.0.0.1 http://127.0.0.1:80; img-src 'self' data: blob: http://127.0.0.1 http://127.0.0.1:80; connect-src 'self' http://127.0.0.1 http://127.0.0.1:80; font-src 'self' data: http://127.0.0.1 http://127.0.0.1:80; frame-ancestors 'self'"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on: [mcpo, drawio-viewer]

volumes:
  qdrant_data:
  openwebui_data:
