<!-- ragfarm draw.io render smoke test — VERIFIED RENDERING 2026-08-09.
     Byte-for-byte the wrapper that infra/openwebui/setup_openwebui.py bakes into the
     vision preset's RULE 5, captured on a box whose RAGFARM_PUBLIC_HOST was
     192.168.0.208. Regenerate after changing that host or the wrapper:

       .venv/bin/python - <<'PY'
       import sys, re, pathlib
       sys.path.insert(0, 'infra/openwebui'); import setup_openwebui as o
       b = o.PROMPT_BODIES['vision']; i = b.index('b) draw.io')
       pathlib.Path('tests/fixtures/drawio-wrapper-reference.html').write_text(
           re.search(r"```html\n(.*?)\n```", b[i:], re.S).group(1))
       PY

     WHY IT EXISTS: a blank draw.io pane in chat has three possible causes and the UI
     shows the same empty white box for all of them. Open this file in the DEMO
     BROWSER (http://<host>/fixtures/drawio-wrapper-reference.html) to split them:
       renders two boxes -> viewer, mirror, host URL and CSP are all fine, so the
                            blank pane was the model's XML (see RULE 5's four rules)
       blank / JS error   -> the mirror is missing (scripts/fetch-drawio-viewer.sh)
                             or this file's baked host no longer matches the box
-->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{margin:0;padding:10px;background:#fff}.mxgraph{width:100%;height:500px;border:1px solid #ccc;border-radius:6px}.err{font:13px sans-serif;color:#b85450;padding:8px}</style>
<script>
  window.STYLE_PATH   = 'http://192.168.0.208/styles';
  window.SHAPES_PATH  = 'http://192.168.0.208/shapes';
  window.STENCIL_PATH = 'http://192.168.0.208/stencils';
  window.DRAW_MATH_URL = 'http://192.168.0.208/math4/es5';
  window.GRAPH_IMAGE_PATH = 'http://192.168.0.208/img';
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.getElementById('ragfarm-graph');
    var src = document.getElementById('ragfarm-xml');
    var xml = src ? src.textContent.trim() : '';
    function fail(m) { box.className = 'err'; box.textContent = m; }
    if (xml.indexOf('</mxfile>') < 0)
      return fail('Diagram XML is missing or was cut off before </mxfile> — the answer did not finish. Ask again, or ask for a simpler diagram.');
    box.setAttribute('data-mxgraph', JSON.stringify({ highlight: '#0000ff', nav: true,
      resize: true, toolbar: 'zoom layers lightbox', xml: xml }));
    var s = document.createElement('script');
    s.src = 'http://192.168.0.208/js/viewer-static.min.js';
    s.onerror = function () { fail('draw.io viewer did not load from http://192.168.0.208 — the local mirror is missing or unreachable from this browser.'); };
    document.body.appendChild(s);
  });
</script>
</head><body>
<div class="mxgraph" id="ragfarm-graph"></div>
<script type="application/xml" id="ragfarm-xml">
  <mxfile host="app.diagrams.net">
    <diagram name="example" id="d0">
      <mxGraphModel dx="800" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="850" pageHeight="600" math="0" shadow="0">
        <root>
          <mxCell id="0" />
          <mxCell id="1" parent="0" />
          <mxCell id="n1" value="First box" style="rounded=1;whiteSpace=wrap;html=1;" vertex="1" parent="1">
            <mxGeometry x="80" y="120" width="140" height="60" as="geometry"/>
          </mxCell>
          <mxCell id="n2" value="Second box" style="rounded=1;whiteSpace=wrap;html=1;" vertex="1" parent="1">
            <mxGeometry x="300" y="120" width="140" height="60" as="geometry"/>
          </mxCell>
          <mxCell id="e1" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=classic;" edge="1" parent="1" source="n1" target="n2">
            <mxGeometry relative="1" as="geometry"/>
          </mxCell>
        </root>
      </mxGraphModel>
    </diagram>
  </mxfile>
</script>
</body></html>
